<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Track your parcel</title><style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f5f5f5;color:#222}
header{background:#1f6f4a;color:#fff;padding:18px 40px;font-size:26px;font-weight:bold}

</style></head><body><header>Fynbos Freight</header><main><h1>Track your parcel</h1><p>Enter your tracking number on the home page to see where your parcel is.</p><p>Fynbos Freight never asks for card details, PINs or passwords by SMS, email or WhatsApp.</p><p>Our depots in Cape Town, Durban and Johannesburg are open Monday to Friday, 08:00 to 17:00.</p></main><footer>&copy; 2026</footer></body></html>
