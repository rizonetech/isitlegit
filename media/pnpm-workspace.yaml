# media/ is its own pnpm root, so its lockfile is media/pnpm-lock.yaml and the root lockfile is never touched
# (coordinator, 2026-10-30, D10 step 5). The root workspace lists only "." and "site".
packages:
  - "."

# Remotion bundles the compositions with esbuild, whose install script fetches its platform binary.
allowBuilds:
  esbuild: true

# Remotion runtime consumers pin vulnerable Zod4.5.4; keep every media resolution patched.
# GHSA-mrhx-c7xc-m3w5, coordinator MEDIA-ZOD-SECURITY, 2026-11-04.
overrides:
  zod: 4.6.7
