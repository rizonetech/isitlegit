# The Worker is the root package; the Astro marketing site joins as `site/` with its own TypeScript 6.0.3 pin (D07 T06).
packages:
  - "."
  - "site"

# pnpm 11 refuses to install while a dependency's build script is unapproved. Wrangler needs esbuild and workerd;
# @parcel/watcher (Tailwind's --watch) only builds from source when its prebuilt platform package is missing.
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  workerd: true

# Package scripts run in pnpm's own shell on every platform, so `$(git rev-parse HEAD)` in `dev` works under Windows cmd too.
shellEmulator: true

# Refuse to install on a Node outside package.json `engines` (the stack doc pins Node 24.18.0; `.nvmrc` names it).
engineStrict: true

# WORKAROUND: Miniflare 5.20261019.2-beta (under Wrangler 4.152.0 and @cloudflare/vitest-plugin 1.4.7) pins undici 7.29.1,
# inside GHSA-xjj6-f33q-929c (high, denial of service on excessive content-encodings; fixed in 7.30.1). The owning fix is
# Wrangler 4.153.0 with @cloudflare/vitest-plugin 1.4.8 (Miniflare 5.20261023.0-beta ships undici 7.30.1), installable once
# past pnpm's 24-hour minimum release age (2026-10-27 14:30 UTC); remove this override with that upgrade.
overrides:
  undici@7.29.1: 7.30.1
