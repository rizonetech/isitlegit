# Review policy for this repository, read by scripts/review-dispatch.py.
# The explicit Codex self_review policy overrides the cross-family rule and
# regular schedule below for Codex only. Historical pins keep their own policy.
#
# A route names exactly one reviewer for work written by one agent, never of
# the writer's own model family (the CLI names it: codex is OpenAI, agy is
# Google, claude is Anthropic). A reviewer that is not installed, fails, times
# out, returns nothing or replies OVERALL: blocked is skipped and the reason
# recorded: there is no review, never an approval, and no other reviewer runs.
#
# Loaded strictly: an unknown key, an unknown CLI, a malformed model, a route
# naming an undefined reviewer, a second reviewer in a route, or a reviewer of
# the writer's own model family refuses every dispatch. The schedule is loaded
# as strictly: an unknown lens or an effort a routed CLI does not take refuses
# too. Edit this file to suit the project: it is a starting point, not a link.

schema_version = 1

# Operator REVIEW-18, 2026-11-04: Codex self-reviews plan, then combined completion.
self_review = ["codex"]
self_review_policy = "codex-two-pass-v1"
plan_transition = ["codex-self-review"]
# Operator, 2026-11-04: one bound reconciliation after a returned completion with gaps.
reconciliation = ["codex"]

# GPT-6 Astra through the Codex CLI, read-only sandbox. The effort here is the
# default for a pass the schedule does not cover; [schedule] sets each pass's
# own effort.
[reviewers.astra]
cli = "codex"
model = "gpt-6-astra"
effort = "low"

# Muse Wonder through Muse Code (the operator's subscription, Standard mode, contributor mode off on every call), the
# final reviewer: one review per section after the Astra rounds stop (operator, 2026-10-26 23:03). It is no route:
# [schedule.final] names it, and it is of a family neither the writer nor Astra belongs to. Muse Wonder, not Wonder
# Full, at high effort (operator, 2026-10-28 01:44); the catalog's id is muse-wonder-1.0.
[reviewers.wonder]
cli = "muse"
model = "muse-wonder-1.0"
effort = "medium"

# Gemini 4 Argon through Antigravity, the reviewer of the Codex-written Loupe 1.1 lane (operator, 2026-10-31 18:55
# SAST): a family that is neither the writer's (OpenAI) nor Claude's, on its own usage pool. Antigravity carries the
# effort in the model name; medium, as every pass runs at medium at most (operator, 2026-10-31).
[reviewers.argon]
cli = "agy"
model = "gemini-4-argon-medium"

# Claude Code writes and Astra reviews; Codex writes and Argon reviews; Antigravity (Gemini) writes and Astra reviews
# (operator, 2026-10-31 20:55 SAST: lanes moved off Claude to separate usage pools, each reviewed by another family).
[routes]
claude = ["astra"]
codex = ["astra"]
gemini = ["astra"]
muse = ["astra"]

# The review schedule. The dispatcher picks each pass's effort and lenses, so
# the loop runs the same way every time: a plan review before the build, the
# completion review after it, three fixed adversarial rounds at falling effort,
# then one low-effort lens per round in rotation until the loop stops. With
# severity_stop_after = 0 the first round with no P1 or P2 finding (its worst
# P3, or none) ends the loop; a low-effort round that finds a P1 is followed by
# one medium-effort adversarial round. The cap stays 33 rounds. Delete the
# whole [schedule] block to review every round at the reviewer's own effort.
[schedule]
severity_stop_after = 0

# Every pass runs at low from 2026-11-03 20:02 SAST (operator: low effort across plan, completion and all rounds,
# capped at 3 regular rounds / 5 reviews total). A pass keeps the schedule of the pin it ran under, so sections
# already in their rounds stamp unchanged.
[schedule.plan]
effort = "low"
lenses = ["plan"]

[schedule.completion]
effort = "low"

# All rounds at low from 2026-11-03 20:02 SAST (operator).
[[schedule.rounds]]
effort = "low"
lenses = ["adversarial", "integration", "source-defect", "plan-delivery"]

[[schedule.rounds]]
effort = "low"
lenses = ["adversarial"]

[[schedule.rounds]]
effort = "low"
lenses = ["adversarial"]

# A `light` section (its `**Risk:** light` line, D00 T01 §15: a section whose named paths are all tooling, tests or
# documentation) runs these fixed rounds in place of the list above; the rotation, the escalation and the severity stop
# are the same, so a round that finds a P1 or P2 still earns another round to prove its fix.
[schedule.light]
rounds = [{ effort = "low", lenses = ["adversarial", "plan-delivery"] }]

[schedule.rotation]
effort = "low"
lenses = ["consistency", "quality", "design", "optimization", "record"]

[schedule.escalation]
effort = "low"
lenses = ["adversarial"]

# One final review per section by Muse Wonder, after the rounds stop (the last returned round declares no P1 or
# P2). A P1 or P2 it finds is fixed and proven by one more regular round; it is never repeated.
#
# mode switches it: "required" (the stamp needs it), "optional" (it runs when asked; a reviewer that returns no review
# is a warning, and the stamp may go without it) or "off" (it never runs; the stamp takes none). The mode at a
# section's stamped commit is the one its receipt is held to. Off from 2026-10-27, back on as optional from 2026-10-28
# 01:44 (operator: Muse Wonder at high effort, soft fail kept). Off again from 2026-10-29 20:36 SAST, for both lanes,
# while the weekly Muse usage limit is reached (operator); set it back to "optional" when the limit resets.
[schedule.final]
reviewer = "wonder"
effort = "medium"
lenses = ["adversarial", "integration", "source-defect", "plan-delivery"]
mode = "off"

# Operator EFFORT-22, 2026-11-04: repair verification uses medium; plan remains low.
[schedule.reconciliation]
effort = "medium"
lenses = ["adversarial", "integration", "plan-delivery", "record"]

# Operator EFFORT-22, 2026-11-04: combined quality and completion uses medium.
[schedule.combined]
effort = "medium"
lenses = ["adversarial", "integration", "source-defect", "plan-delivery", "consistency", "record", "quality", "optimization", "design"]

# Coordinator scoped repair decision: one successor for this exact failed reconciliation only.
[reconciliation_extensions]
"docs/reviews/00-workspace/D00-T01-s36.md" = "bd520ac7d1311303"
"docs/reviews/03-vision/D03-T04-s52.md" = "1a6c0d8e3ba2dd96"
