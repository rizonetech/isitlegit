version: 2
updates:
  # GitHub Actions stay pinned to full commit SHAs (D00 T01 §4); Dependabot proposes the bumps.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
  # The Worker's npm packages are exact pins (D00 T01 §2); Dependabot proposes each bump as its own pull request.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
