# The Worker and TODO gates on every push and pull request. CI never deploys: deploys run from the build session with
# the local Wrangler login after the same gates pass (tech stack spec, "CI").
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - name: pnpm typecheck
        run: pnpm typecheck
      - name: pnpm lint
        run: pnpm lint
      - name: pnpm test
        run: pnpm test
      - name: pnpm build
        run: pnpm build

      - name: TODO graph validate
        run: python3 scripts/todo-graph.py validate
      - name: Implementation plan is current
        run: python3 scripts/todo-graph.py plan --check
      - name: Project script tests
        run: python3 -m unittest discover -s tests/scripts
      - name: Kit script tests
        run: python3 -m unittest discover -s scripts/tests
