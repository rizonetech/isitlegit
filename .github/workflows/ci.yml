# The Worker and TODO gates on every push and pull request. CI never deploys: deploys run from the build session with
# the local Wrangler login after the same gates pass (tech stack spec, "CI"). Four jobs, so `gh run rerun --failed`
# repeats only the group that failed. Timeouts stop a hung install or Chromium long before the six-hour default; measured
# on run 40432358282: Worker gates 29 s (10 min), TODO graph 4 s (5 min), project tests 2 min 14 s (15 min), kit 38 s (10 min).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    name: Worker gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - name: pnpm typecheck
        run: pnpm typecheck
      - name: pnpm lint
        run: pnpm lint
      - name: pnpm test
        run: pnpm test
      - name: pnpm build
        run: pnpm build

  todo:
    name: TODO graph
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: `todo-graph.py validate` checks that every stamp's commit exists (a shallow clone has only HEAD).
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: TODO graph validate
        run: python3 scripts/todo-graph.py validate
      - name: Implementation plan is current
        run: python3 scripts/todo-graph.py plan --check

  project-scripts:
    name: Project script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Project script tests
        run: python3 -m unittest discover -s tests/scripts
        env:
          # The image's /usr/bin/chromium (/usr/local/share/chromium) aborts: it has no setuid sandbox and AppArmor blocks
          # the user-namespace one. Google Chrome ships a working sandbox, which the mockup exporter keeps on.
          MOCKUP_CHROMIUM: /usr/bin/google-chrome

  kit-scripts:
    name: Kit script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Kit script tests
        run: python3 -m unittest discover -s scripts/tests
