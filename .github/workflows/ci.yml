# Full gates on reviewed coordinator batches, pull requests and explicit dispatch. CI never deploys: deploys run from the build session with
# the local Wrangler login after the same gates pass (tech stack spec, "CI"). Separate jobs, so `gh run rerun --failed`
# repeats only the group that failed; the Worker suite runs in four shards (worker-tests) and the Chromium tests in three, one file at a time (browser-tests). Timeouts stop a hung install
# or Chromium long before the six-hour default; first measured on run 40432358282 (Worker gates 29 s, TODO graph 4 s,
# project tests 2 min 14 s, kit 38 s); on 2026-10-31 the whole Worker suite took 23 minutes in one job.
name: CI

on:
  push:
    branches: [coordinator-gate]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same lane branch cancels that branch's run still in progress, so the shared runner queue holds
# only each branch's latest head. main and coordinator-gate are never cancelled or replaced: each of their runs has a
# group of its own (the run id), because a group holds one waiting run and a newer push replaces it even with
# cancel-in-progress off (2026-11-01: gate run 41253461955 at d391703d was cancelled that way).
concurrency:
  group: ci-${{ github.ref }}${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/coordinator-gate') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/coordinator-gate' }}

jobs:
  worker:
    name: Worker gates
    runs-on: ubuntu-24.04
    # The Worker suite runs in the worker-tests job's shards; this job keeps the static gates, a11y and the build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Design tool requirements
        run: pip install -r design/tools/requirements.txt
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - name: pnpm typecheck
        run: pnpm typecheck
      - name: pnpm lint
        run: pnpm lint
      - name: pnpm build:assets
        run: pnpm build:assets
      - name: Generated files are committed
        # git status, not git diff: a generated file left out of the commit is untracked, and diff never sees it.
        run: test -z "$(git status --porcelain -- src/web public design/fonts)" || { git status --porcelain -- src/web public design/fonts; exit 1; }
      - name: The voice decoder's WebAssembly matches its sources
        # src/voice/minimp3.wasm and resample.wasm are built from native/ with the pinned Zig (D01 T03 §7, §9).
        run: |
          pip install -r native/requirements.txt
          python3 scripts/build-wasm.py --check
      - name: The lookalike map matches its vendored Unicode tables
        # src/checks/confusables-map.json is built from vendor/unicode/ (D02 T03 §1).
        run: node scripts/build-confusables.ts --check
      - name: pnpm test:a11y
        # axe-core over the component gallery and every shell frame in Chromium (D07 T01 §10); left out of pnpm test.
        run: pnpm test:a11y
        env:
          MOCKUP_CHROMIUM: /usr/bin/google-chrome
      - name: pnpm build
        run: pnpm build
      # The marketing site (site/, D07 T06 §1): its static build, Astro's type check, and its tests over the built pages.
      - name: pnpm --filter site build
        run: pnpm --filter site build
      - name: pnpm --filter site check
        run: pnpm --filter site check
      - name: pnpm --filter site test
        # The site's browser test drives the phone menu, the copy action and axe in Chromium (D07 T06 §2).
        run: pnpm --filter site test
        env:
          MOCKUP_CHROMIUM: /usr/bin/google-chrome

  worker-tests:
    # The suite in four shards side by side (three until 2026-10-31 20:00, when two hit the 15-minute step limit as the
    # suite grew): whole, it took 23 minutes in CI on 2026-10-31 (2,180+ tests, a workerd
    # per file) and outgrew one job. Every shard runs (fail-fast off), and tests/scripts/test_ci_workflow.py refuses a
    # matrix that leaves one out.
    name: Worker tests (${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Design tool requirements
        run: pip install -r design/tools/requirements.txt
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - name: pnpm build:assets
        run: pnpm build:assets
      # Browser Run's local simulation launches a Chrome that Wrangler downloads (about 325 MB) on first use; cached so a
      # shard spends its minutes on tests, not on fetching a browser (2026-10-31: a download pushed shard 3 past its
      # step limit twice). The key follows the lockfile, so a Wrangler upgrade fetches its own Chrome.
      - name: Cache Wrangler's Chrome
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/.wrangler/chrome
          key: wrangler-chrome-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: pnpm test (one shard)
        # Below the job's 20 minutes (a shard takes about 8), so a stalled shard ends in its own step. The reporter's
        # minute heartbeat (scripts/lib/vitest-file-reporter.ts) names the files open before it; its exit line is best
        # effort, since GitHub kills the process tree seconds after signalling it (2026-10-31).
        timeout-minutes: 15
        run: pnpm test --project worker --project node --shard=${{ matrix.shard }}/4
        env:
          # test/node/theme.test.ts and fonts.test.ts measure the compiled styles and fonts in Chromium; the image's
          # /usr/bin/chromium has no usable sandbox (see the project-scripts job), Google Chrome does.
          MOCKUP_CHROMIUM: /usr/bin/google-chrome

  browser-tests:
    # The tests that drive Chromium (vitest.config.ts's browser project), apart from the Worker suite and one file at a
    # time: side by side on a two-CPU runner their browsers starved each other and their own waits timed out
    # (2026-11-01: 19 red runs in an hour across every lane, each test green alone). About 10 minutes of files in all,
    # in three shards. Every shard runs, as for worker-tests.
    name: Browser tests (${{ matrix.shard }} of 3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Design tool requirements
        run: pip install -r design/tools/requirements.txt
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - name: pnpm build:assets
        run: pnpm build:assets
      # Browser Run's local simulation launches a Chrome that Wrangler downloads (about 325 MB) on first use; cached so a
      # shard spends its minutes on tests, not on fetching a browser (2026-10-31: a download pushed shard 3 past its
      # step limit twice). The key follows the lockfile, so a Wrangler upgrade fetches its own Chrome.
      - name: Cache Wrangler's Chrome
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/.wrangler/chrome
          key: wrangler-chrome-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: pnpm test (one shard)
        # Below the job's 20 minutes (a shard takes about 4), so a stalled shard ends in its own step. The reporter's
        # minute heartbeat (scripts/lib/vitest-file-reporter.ts) names the files open before it; its exit line is best
        # effort, since GitHub kills the process tree seconds after signalling it (2026-10-31).
        timeout-minutes: 15
        run: pnpm test --project browser --no-file-parallelism --shard=${{ matrix.shard }}/3
        env:
          # test/node/theme.test.ts and fonts.test.ts measure the compiled styles and fonts in Chromium; the image's
          # /usr/bin/chromium has no usable sandbox (see the project-scripts job), Google Chrome does.
          MOCKUP_CHROMIUM: /usr/bin/google-chrome

  voice-bench:
    # D01 T03 §9: the voice decoder's timings beside FFmpeg's on the same inputs. Each output's length (and the damaged
    # file's refusal) is checked before a timing is printed, so a failed or truncated run fails the job.
    name: Voice decoder against FFmpeg
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: FFmpeg
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg && ffmpeg -version | head -1
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - name: Voice bench
        run: node scripts/voice-bench.ts

  todo:
    name: TODO graph
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: `todo-graph.py validate` checks that every stamp's commit exists (a shallow clone has only HEAD).
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: TODO graph validate
        run: python3 scripts/todo-graph.py validate
      - name: Implementation plan is current
        run: python3 scripts/todo-graph.py plan --check

  project-scripts:
    name: Project script tests (${{ matrix.shard }} of 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Design tool requirements
        run: pip install -r design/tools/requirements.txt
      - name: Project script tests
        run: python3 scripts/ci_unittest_shard.py --shard ${{ matrix.shard }} --shards 4
        env:
          # The font checks need fonttools; here they must run, not skip.
          REQUIRE_FONT_TOOLS: "1"
          # The image's /usr/bin/chromium (/usr/local/share/chromium) aborts: it has no setuid sandbox and AppArmor blocks
          # the user-namespace one. Google Chrome ships a working sandbox, which the mockup exporter keeps on.
          MOCKUP_CHROMIUM: /usr/bin/google-chrome

  kit-scripts:
    name: Kit script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Kit script tests
        run: python3 -m unittest discover -s scripts/tests
