<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App navigation</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@600;700;800&amp;family=Exo+2:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width: 256px; height: 1000px; box-sizing: border-box; padding: 24px 16px; background: #F8F8F9; border-right: 1px solid #E3E2E6; display: flex; flex-direction: column; gap: 20px; font-family: 'Exo 2', sans-serif; color: #181519">
  <a href="Cases.dc.html" style="display: block; padding: 0 8px"><img src="../../brand/logo-svg/isitlegit-logo.svg" alt="IsItLegit, cases" style="height: 30px; display: block"></a>
  <button class="btn btn-ghost" style="justify-content: space-between; height: 44px; padding: 0 12px; font-size: 15px" aria-label="Switch organisation, current Karoo Couriers">
    <span style="display: flex; align-items: center; gap: 10px"><span style="width: 24px; height: 24px; border-radius: 6px; background: #181519; color: #FFFFFF; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">KC</span>Karoo Couriers</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4D4953" stroke-width="2" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
  </button>
  <a href="Upload.dc.html" class="btn btn-primary" style="width: 100%">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Check a file</a>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <a href="Cases.dc.html" class="{{c.cases}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Cases</a>
    <a href="Suppliers.dc.html" class="{{c.suppliers}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-6h6v6"/></svg>Suppliers</a>
    <a href="Protect.dc.html" class="{{c.protect}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Protect</a>
    <a href="Monitor.dc.html" class="{{c.monitor}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>Monitor<span class="pill pill-mal" style="margin-left: auto; height: 22px">1 new</span></a>
    <a href="Team.dc.html" class="{{c.team}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.6c2 .7 3.2 2.5 3.6 5.4"/></svg>Team</a>
  </div>
  <div style="display: flex; flex-direction: column; gap: 2px">
    <p class="tiny muted" style="padding: 0 12px 6px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Settings</p>
    <a href="Domains.dc.html" class="{{c.domains}}">Domains and addresses</a>
    <a href="Account.dc.html" class="{{c.account}}">Account</a>
    <a href="Plan.dc.html" class="{{c.plan}}">Plan<span class="pill pill-neutral" style="margin-left: auto; height: 22px">Trial, 11 days</span></a>
  </div>
  <div class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 10px; margin-top: auto">
    <p class="small" style="font-weight: 600">Forward suspicious mail as an attachment to</p>
    <div style="display: flex; align-items: center; gap: 8px">
      <span class="mono" style="font-size: 13px; font-weight: 600">check@isitlegit.co.za</span>
      <button class="btn btn-ghost btn-sm" style="height: 30px; padding: 0 8px; margin-left: auto" aria-label="Copy the check address">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#181519" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
      </button>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
    <span style="width: 32px; height: 32px; border-radius: 50%; background: #FFF1EC; color: #CC2E00; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">TN</span>
    <span style="display: flex; flex-direction: column; line-height: 1.25"><span class="small" style="font-weight: 600">Thandi Nkosi</span><span class="tiny muted">Owner</span></span>
    <a href="Signin.dc.html" class="tiny" style="margin-left: auto">Sign out</a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["cases","suppliers","protect","monitor","team","domains","account","plan"],"default":"cases"},"$preview":{"width":256,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'cases';
const keys = ['cases', 'suppliers', 'protect', 'monitor', 'team', 'domains', 'account', 'plan'];
const c = {};
keys.forEach((k) => { c[k] = k === active ? 'navlink navlink-active' : 'navlink'; });
return { c };
}
}
</script>
</body>
</html>
